name: Auto Release

# When a PR is merged into main, cut a release automatically.
#
# Every merged PR ships a release — patch is the floor. Bump level comes from
# PR labels:
#   release:major -> major   release:minor -> minor   (default) -> patch
# So even docs/chore PRs bump the patch version; there is no way to merge
# without a release.
#
# This workflow bumps the version, tags it, pushes to main, and publishes the
# GitHub Release itself — it does not rely on release.yml, because a tag pushed
# with GITHUB_TOKEN would not trigger that workflow. The release body is
# auto-generated by GitHub from the commits/PRs since the previous tag.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# Serialize releases so two merges can't race on pushing to main.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history + tags, so release notes span the last tag

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine bump level from labels
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          level=patch
          case ",$LABELS," in
            *,release:major,*) level=major ;;
            *,release:minor,*) level=minor ;;
          esac
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "Bumping: $level"

      - name: Bump, tag and push (retrying if main moved)
        id: ver
        env:
          LEVEL: ${{ steps.bump.outputs.level }}
        # `main` can move while this job runs — another PR merging is enough.
        # Rather than gate merges on the release, redo the bump on top of
        # whatever main now is and push again. Each attempt starts from a clean
        # origin/main, so the version is always computed from the current
        # package.json instead of rebasing a stale bump onto a newer one (which
        # would conflict on exactly the line it changes).
        #
        # The push is --atomic: the branch and the tag land together or not at
        # all. A tag pushed alone (the branch rejected) would point at a commit
        # on no branch and make every later release collide on that version.
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch --tags --force --prune --prune-tags origin main
            git reset --hard origin/main

            node scripts/release.mjs "$LEVEL"
            version="$(node -p "require('./package.json').version")"

            if git push --atomic --follow-tags origin main; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::warning::Push rejected (attempt $attempt/5) — main moved, retrying."
            git tag -d "v$version"
            sleep $((attempt * 5))
          done

          echo "::error::Could not push the release after 5 attempts."
          exit 1

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --title "v${{ steps.ver.outputs.version }}" \
            --generate-notes
